# TE-6090 / TE-5777 Phase 6 cross-org onboarding dry-run.
#
# This file is the dry-run shape, living only on the
# te-6090-cross-org-dry-run branch. main keeps the original demo
# pipeline. The pipeline's "Pipeline file" UI setting still points at
# .buildkite/pipeline.yml; each build reads it from its own branch.
#
# Two independent branches:
#   - Backfill (gated by a block step, no dependents): seeds historical
#     commit metadata into the suite-scoped S3 prefix so a model can be
#     trained. Unblock once for the cold start; ignored on rebuilds.
#   - Plan + select + run (automatic): requests an xgboost-selected plan
#     for the rspec suite and runs it. Pre-training this skip-selects all
#     tests; post-training it applies real selection.
steps:
  - block: "Run backfill?"
    key: backfill_gate
    depends_on: ~
    prompt: |
      Upload historical git commit metadata for the rspec suite?

      Run once to seed the cold start before the first training run.
      Not needed on rebuilds that only re-test selection.

  - label: ":test_tube: Backfill commit metadata"
    key: backfill
    depends_on: backfill_gate
    command: .buildkite/steps/backfill.sh
    agents:
      queue: "default"
    env:
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: "rspec"

  - label: ":rspec: Generate unit testing plan"
    command: .buildkite/steps/plan.sh
    key: unit_plan
    # Opt out of the implicit dependency on the preceding block step so
    # plan+select+run runs immediately rather than waiting on backfill.
    depends_on: ~
    agents:
      queue: "default"
    env:
      BKTEC_MAX_PARALLELISM: 7
      BKTEC_TARGET_TIME: 2m
      BKTEC_STEP_LABEL: ":rspec: RSpec unit"
      BKTEC_STEP_COMMAND: ".buildkite/steps/test.sh"
      BUILDKITE_TEST_ENGINE_TEST_CMD: "bundle exec rspec {{testExamples}} --format progress --format json --out tmp/result.json"
      BUILDKITE_TEST_ENGINE_TEST_FILE_EXCLUDE_PATTERN: "spec/{acceptance,features}/**/*_spec.rb"
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: "rspec"
      BUILDKITE_TEST_ENGINE_RETRY_COUNT: 1
      BUILDKITE_TEST_ENGINE_RESULT_PATH: "tmp/result.json"
      BUILDKITE_TEST_ENGINE_TEST_RUNNER: rspec

  # Evaluation capture (docs/evaluating-test-prediction.md). Captures
  # predicted plans at chosen cutoffs as artifacts so they can be diffed
  # against the current plan offline. Isolated from the real plan+run
  # branch above so it can never collide with the plan the tests run on.
  #
  # ONE STEP PER CUTOFF. bktec keys each plan by an identifier defaulting
  # to ${BUILDKITE_BUILD_ID}/${BUILDKITE_STEP_ID}, and overriding it was
  # removed (test-engine-client PR #102). Multiple plan requests in one
  # step share a step id, so the server returns the same cached plan for
  # every cutoff. A separate step per cutoff gives each a distinct step id
  # and therefore a distinct plan. The sweep is the score-cutoff trust
  # axis (count term neutralised) plus one count-cutoff sample.
  - group: ":mag: Capture plans for evaluation"
    steps:
      - &eval_capture
        label: ":mag: Capture sc0 (keep everything)"
        command: .buildkite/steps/evaluate-capture.sh
        depends_on: ~
        agents:
          queue: "default"
        env: &eval_capture_env
          EVAL_SCORE_CUTOFF: "0"
          EVAL_COUNT_CUTOFF: "0"
          EVAL_SLUG: "sc0"
          BUILDKITE_TEST_ENGINE_SUITE_SLUG: "rspec"
          # bktec plan validates these even though the capture never runs
          # tests or reads results. Mirror the real plan step so the
          # candidate set being evaluated matches production selection.
          BUILDKITE_TEST_ENGINE_TEST_RUNNER: rspec
          BUILDKITE_TEST_ENGINE_RESULT_PATH: "tmp/result.json"
          BUILDKITE_TEST_ENGINE_TEST_CMD: "bundle exec rspec {{testExamples}} --format progress --format json --out tmp/result.json"
          BUILDKITE_TEST_ENGINE_TEST_FILE_EXCLUDE_PATTERN: "spec/{acceptance,features}/**/*_spec.rb"

      - <<: *eval_capture
        label: ":mag: Capture sc0.5"
        env:
          <<: *eval_capture_env
          EVAL_SCORE_CUTOFF: "0.5"
          EVAL_SLUG: "sc0.5"

      - <<: *eval_capture
        label: ":mag: Capture sc0.8"
        env:
          <<: *eval_capture_env
          EVAL_SCORE_CUTOFF: "0.8"
          EVAL_SLUG: "sc0.8"

      - <<: *eval_capture
        label: ":mag: Capture sc0.9"
        env:
          <<: *eval_capture_env
          EVAL_SCORE_CUTOFF: "0.9"
          EVAL_SLUG: "sc0.9"

      # Count-cutoff sample: score_cutoff=1 so only the count term applies
      # and the set is the top N by rank.
      - <<: *eval_capture
        label: ":mag: Capture cc50 (top 50 by rank)"
        env:
          <<: *eval_capture_env
          EVAL_SCORE_CUTOFF: "1"
          EVAL_COUNT_CUTOFF: "50"
          EVAL_SLUG: "cc50"
